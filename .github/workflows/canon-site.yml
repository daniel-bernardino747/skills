# Publica o site do Cânone de UI no GitHub Pages (ADR-0008).
# Sempre gera da main, inclusive quando o gatilho é uma tag canon-v*: o site mostra o Cânone
# vigente e marca o que ainda não entrou em nenhuma tag.
name: canon-site

on:
  push:
    branches: [main]
    paths:
      - '**/dont-mess-up-ui/principles/**'
      - '**/dont-mess-up-ui/demos/**'
      - 'scripts/build-canon-site.mjs'
      - '.github/workflows/canon-site.yml'
    tags: ['canon-v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canon-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-canon-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
