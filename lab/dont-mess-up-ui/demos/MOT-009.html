<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-009 — demo</title>
<link rel="stylesheet" href="_kit.css">
<link rel="stylesheet" href="_anticipation.css">
<style>
  @keyframes d-100 { 0% { transform: translateY(0); } 20% { transform: translateY(10px); } 80%, 100% { transform: translateY(-130px); } }
  @keyframes d-200 { 0% { transform: translateY(0); } 33.3% { transform: translateY(10px); } 83.3%, 100% { transform: translateY(-130px); } }
  @keyframes d-350 { 0% { transform: translateY(0); } 46.7% { transform: translateY(10px); } 86.7%, 100% { transform: translateY(-130px); } }
  .run [data-k="d-100"] { animation-name: d-100; animation-duration: calc(500ms * var(--slow)); }
  .run [data-k="d-200"] { animation-name: d-200; animation-duration: calc(600ms * var(--slow)); }
  .run [data-k="d-350"] { animation-name: d-350; animation-duration: calc(750ms * var(--slow)); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><h3>Preparação de 100ms</h3><span class="tag ok">segue</span>
    <div class="stage"><div class="ball" data-k="d-100"></div></div><div class="cap">100ms de 500ms (20%)</div></div>
  <div class="cell"><h3>Preparação de 200ms</h3><span class="tag bad">viola</span>
    <div class="stage"><div class="ball" data-k="d-200"></div></div><div class="cap">200ms de 600ms (33%)</div></div>
  <div class="cell"><h3>Preparação de 350ms</h3><span class="tag bad">viola</span>
    <div class="stage"><div class="ball" data-k="d-350"></div></div><div class="cap">350ms de 750ms (47%)</div></div>
</div>
<script>window.DEMO = { controls: ['replay', 'loop', 'slow'], period: 1500, hint: 'Mesmo pulo com preparação contrária de +10px; só muda quanto tempo ela ocupa.' };</script>
<script src="_kit.js"></script>
</body>
</html>
