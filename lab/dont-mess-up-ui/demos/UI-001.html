<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI-001 — demo</title>
<link rel="stylesheet" href="_kit.css">
<style>
  .stage { height: 120px; display: grid; place-items: center; }
  .btn { font: 600 15px/1 "Geist", ui-sans-serif, sans-serif; color: var(--on-accent); background: var(--accent);
    border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
    transition: transform 220ms cubic-bezier(.3, 1.4, .5, 1); }
  .btn.icon { width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 22px; }
  .btn:active { transform: scale(var(--sx), var(--sy)); transition-duration: 90ms; transition-timing-function: ease-out; }
  .freeze .btn { transform: scale(var(--sx), var(--sy)); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell" style="--sx:1.12;--sy:.88"><h3>Squash em botão com texto</h3><span class="tag bad">viola</span>
    <div class="stage"><button class="btn">Confirmar pedido</button></div><div class="cap">:active scale(1.12, 0.88) — label esmagado</div></div>
  <div class="cell" style="--sx:.97;--sy:.97"><h3>Press uniforme</h3><span class="tag ok">segue</span>
    <div class="stage"><button class="btn">Confirmar pedido</button></div><div class="cap">:active scale(0.97) — texto intacto</div></div>
  <div class="cell" style="--sx:1.12;--sy:.88"><h3>Botão só de ícone</h3><span class="tag ok">segue</span>
    <div class="stage"><button class="btn icon" aria-label="Curtir"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.7 1.2 5.3 3.1 1.6-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></button></div><div class="cap">:active scale(1.12, 0.88) — sem texto, squash cabe</div></div>
</div>
<script>window.DEMO = { controls: ['freeze'], hint: 'Segure o clique em cada botão, ou congele para ver a pose de press.' };</script>
<script src="_kit.js"></script>
</body>
</html>
