<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-012 — demo</title>
<link rel="stylesheet" href="_kit.css">
<link rel="stylesheet" href="_anticipation.css">
<style>
  .pressable { transition: transform 90ms ease-out; cursor: pointer; touch-action: none; }
  .pressable.down { transform: scale(.95); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><h3>Press → salta direto</h3><span class="tag ok">segue</span>
    <div class="stage"><div class="chip pressable" data-double="0"></div></div><div class="cap">:active 0.95 → soltar → sobe</div></div>
  <div class="cell"><h3>Press → prepara de novo → salta</h3><span class="tag bad">viola</span>
    <div class="stage"><div class="chip pressable" data-double="1"></div></div><div class="cap">:active 0.95 → soltar → desce +10 → sobe</div></div>
</div>
<script>
  window.DEMO = { controls: [], hint: 'Segure o clique no quadrado e solte. Enquanto segura ele afunda; ao soltar, salta.' };
  document.querySelectorAll('.pressable').forEach((el) => {
    el.addEventListener('pointerdown', () => {
      el.getAnimations().forEach((a) => { if (!(a instanceof CSSTransition)) a.cancel(); });
      el.classList.add('down');
    });
    const release = () => {
      if (!el.classList.contains('down')) return;
      el.classList.remove('down');
      const frames = el.dataset.double === '1'
        ? [
            { transform: 'scale(.95)' },
            { transform: 'translateY(10px) scale(1)', offset: .2, easing: 'cubic-bezier(.3, 0, .2, 1)' },
            { transform: 'translateY(-90px) scale(1)', offset: .55 },
            { transform: 'translateY(-90px) scale(1)', offset: .7 },
            { transform: 'translateY(0) scale(1)' },
          ]
        : [
            { transform: 'scale(.95)', easing: 'cubic-bezier(.2, .8, .2, 1)' },
            { transform: 'translateY(-90px) scale(1)', offset: .45 },
            { transform: 'translateY(-90px) scale(1)', offset: .65 },
            { transform: 'translateY(0) scale(1)' },
          ];
      el.animate(frames, { duration: el.dataset.double === '1' ? 1000 : 900 });
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointerleave', release);
  });
</script>
<script src="_kit.js"></script>
</body>
</html>
