<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-006 — demo</title>
<link rel="stylesheet" href="_kit.css">
<style>
  :root { --squash-medium-x: 1.12; --squash-medium-y: .88; }
  .stage { height: 150px; display: flex; align-items: center; justify-content: space-around; }
  .like { display: grid; justify-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font-size: 22px; }
  .run .icon { animation: tap calc(300ms * var(--slow)) cubic-bezier(.3, 0, .3, 1) 1; }
  @keyframes tap { 0%, 100% { transform: scale(1, 1); } 35% { transform: scale(var(--sx), var(--sy)); } }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><h3>Mesmo botão, dois literais</h3><span class="tag bad">viola</span>
    <div class="stage">
      <div class="like"><div class="icon" style="--sx:1.25;--sy:.78"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.7 1.2 5.3 3.1 1.6-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>no feed</div>
      <div class="like"><div class="icon" style="--sx:1.04;--sy:.96"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.7 1.2 5.3 3.1 1.6-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>no detalhe</div>
    </div>
    <div class="cap">scale(1.25, 0.78) e scale(1.04, 0.96) escritos no componente</div></div>
  <div class="cell"><h3>Mesmo botão, um token</h3><span class="tag ok">segue</span>
    <div class="stage">
      <div class="like"><div class="icon" style="--sx:var(--squash-medium-x);--sy:var(--squash-medium-y)"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.7 1.2 5.3 3.1 1.6-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>no feed</div>
      <div class="like"><div class="icon" style="--sx:var(--squash-medium-x);--sy:var(--squash-medium-y)"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.7 1.2 5.3 3.1 1.6-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>no detalhe</div>
    </div>
    <div class="cap">os dois usam --squash-medium</div></div>
</div>
<script>window.DEMO = { controls: ['replay', 'loop', 'slow'], period: 900 };</script>
<script src="_kit.js"></script>
</body>
</html>
