<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-004 — demo</title>
<link rel="stylesheet" href="_kit.css">
<link rel="stylesheet" href="_squash.css">
<style>
  .run .v .ball.stuck { animation-name: drop-stuck; }
  @keyframes drop-stuck {
    0%   { transform: translateY(-140px) scale(1, 1); animation-timing-function: cubic-bezier(.5, 0, 1, 1); }
    40%  { transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(0, 0, .3, 1); }
    100% { transform: translateY(0) scale(var(--sx), var(--sy)); }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell" style="--sx:1.15;--sy:.87"><h3>Achata e volta ao neutro</h3><span class="tag ok">segue</span>
    <div class="stage v"><div class="ball"></div></div><div class="cap">… 52% scale(1.15, 0.87) → 100% scale(1, 1)</div></div>
  <div class="cell" style="--sx:1.15;--sy:.87"><h3>Termina achatada</h3><span class="tag bad">viola</span>
    <div class="stage v"><div class="ball stuck"></div></div><div class="cap">100% scale(1.15, 0.87) + fill-mode both</div></div>
</div>
<script>window.DEMO = { controls: ['replay', 'loop', 'slow'], period: 1600 };</script>
<script src="_kit.js"></script>
</body>
</html>
