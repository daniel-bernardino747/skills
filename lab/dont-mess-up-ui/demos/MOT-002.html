<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-002 — demo</title>
<link rel="stylesheet" href="_kit.css">
<link rel="stylesheet" href="_squash.css">
</head>
<body>
<div class="grid">
  <div class="cell" style="--sx:1.15;--sy:.87"><h3>Cai e achata no Y</h3><span class="tag ok">segue</span>
    <div class="stage v"><div class="ghost"></div><div class="ball"></div></div><div class="cap">scale(1.15, 0.87)</div></div>
  <div class="cell" style="--sx:.87;--sy:1.15"><h3>Cai e espicha no Y</h3><span class="tag bad">viola</span>
    <div class="stage v"><div class="ghost"></div><div class="ball"></div></div><div class="cap">scale(0.87, 1.15) — parece quicar de lado</div></div>
  <div class="cell" style="--sx:.87;--sy:1.15"><h3>Bate na parede e achata no X</h3><span class="tag ok">segue</span>
    <div class="stage h"><div class="ghost"></div><div class="ball"></div></div><div class="cap">scale(0.87, 1.15)</div></div>
  <div class="cell" style="--sx:1.15;--sy:.87"><h3>Bate na parede e alarga no X</h3><span class="tag bad">viola</span>
    <div class="stage h"><div class="ghost"></div><div class="ball"></div></div><div class="cap">scale(1.15, 0.87) — atravessa a parede</div></div>
</div>
<script>window.DEMO = { controls: ['replay', 'loop', 'slow', 'freeze'], period: 1500 };</script>
<script src="_kit.js"></script>
</body>
</html>
