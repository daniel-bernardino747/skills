<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOT-011 — demo</title>
<link rel="stylesheet" href="_kit.css">
<link rel="stylesheet" href="_anticipation.css">
</head>
<body>
<div class="grid">
  <div class="cell"><h3>Começa no clique</h3><span class="tag ok">segue</span>
    <div class="stage clickable" data-delay="0"><div class="ball"></div></div><div class="cap">delay 0 · preparação dentro dos 500ms</div></div>
  <div class="cell"><h3>Espera 150ms</h3><span class="tag bad">viola</span>
    <div class="stage clickable" data-delay="150"><div class="ball"></div></div><div class="cap">delay 150ms + 500ms</div></div>
  <div class="cell"><h3>Espera 300ms</h3><span class="tag bad">viola</span>
    <div class="stage clickable" data-delay="300"><div class="ball"></div></div><div class="cap">delay 300ms + 500ms</div></div>
</div>
<script>
  window.DEMO = { controls: [], hint: 'Clique em cada palco. É em tempo real: o que importa é sentir o atraso.' };
  document.querySelectorAll('.stage.clickable').forEach((s) => s.addEventListener('pointerdown', () => {
    const b = s.querySelector('.ball');
    b.getAnimations().forEach((a) => a.cancel());
    b.animate([
      { transform: 'translateY(0)' },
      { transform: 'translateY(10px)', offset: .1, easing: 'cubic-bezier(.3, 0, .2, 1)' },
      { transform: 'translateY(-130px)', offset: .5 },
      { transform: 'translateY(-130px)', offset: .65 },
      { transform: 'translateY(0)' },
    ], { duration: 1000, delay: +s.dataset.delay });
  }));
</script>
<script src="_kit.js"></script>
</body>
</html>
